<!-- 
       색상 / URL 단위
         1) 색상 단위
             => color : 글자 색상
                background-color : 바탕 색상
                 
                background-color : 등록된 색상
                                   white / orange ...
                background-color : 없는 색상
                                   RGB(255,255,255)
                background-color : #ffffff => HTML 색상표
                background-color : RGBA(255,255,255,0.1)
                                      -- 알파(투명) => 0.0~1.0                                       
         2)       
 -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style type="text/css">
p:nth-child(1) {
	background-color: red;
	color: white;
}
p:nth-child(2) {
	font-size: 1.5em;
	background-color: rgb(0,0,255);
}
p:nth-child(3) {
	font-size: 2em;
	background-color: #00ff00;
}
p:nth-child(4) {
	font-size: 150%;
	background-color: rgba(0,0,0,0.1);
}
div {
   width: 500px;
   height: 500px;
   background-color: #ff00ff;
}
h1 {
  color: white; 
}
</style>
</head>
<body>
   <p>여자친구 살해 뒤 1년간 김치냉장고에 시신 숨긴 40대 긴급체포</p>
   <p>미군 아파치 헬기 부안군에 불시착.. 조종사 등 2명 대피</p>
   <p>한밤 제주 리조트서 화재...투숙객 100여명 긴급 대피</p>
   <p>쌓이는 부산 미분양 주택 어쩌나…처음 7000가구 넘어서</p>
   <div>
      <h1>30일 김 의장은 국회에서 취재진에게 "현재 대장동(사건)으로 재판받는 이 대통령에 대해 면소 판결을 받게 해주려는 조치로 볼 수밖에 없다"고 말했다.</h1>
   </div>
</body>
</html>
